version: '3.8'

services:
  # BANCO DE DADOS
  db:
    image: postgres:15-alpine
    container_name: sigan_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sigan_db
    ports:
      - "5432:5432"
    volumes:
      - ./sigan-app.sql:/docker-entrypoint-initdb.d/sigan-app.sql  
      - postgres_data:/var/lib/postgresql/data

  # BACKEND
  backend:
    build: ./backend
    container_name: sigan_backend
    ports:
      - "3000:3000"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=sigan_db
      - JWT_SECRET=seu_segredo_super_secreto
    depends_on:
      - db

  # FRONTEND
  frontend:
    build: ./frontend
    container_name: sigan_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: